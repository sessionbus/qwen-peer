name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.24.x'
  GOLANGCI_LINT_VERSION: 'v2.12.2'
  ACTIONLINT_VERSION: 'v1.7.7'

jobs:
  qwen:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Download modules
        env:
          GOWORK: 'off'
        run: go mod download
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Build peer commands
        env:
          GOWORK: 'off'
        run: go build -o "$RUNNER_TEMP/qwen-peer" ./cmd/qwen-peer
      - name: Test Qwen and shared fixtures
        env:
          GOWORK: 'off'
        run: go test ./...
      - name: Race test Qwen and shared fixtures
        env:
          GOWORK: 'off'
        run: go test -race ./...
      - name: Vet
        env:
          GOWORK: 'off'
        run: go vet ./...
      - name: Lint
        env:
          GOWORK: 'off'
        run: |
          go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"
          golangci-lint run ./...
      - name: Qwen Go archive
        run: ./scripts/package-product qwen "${RUNNER_TEMP}/qwen archive"

  workflow-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"
      - run: actionlint
